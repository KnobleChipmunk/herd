[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["attention", "bindings", "context_collector", "fencecheck", "gates", "herdsetup", "herdtool", "librarian", "merge_stack", "mkbrief", "mutate", "preflight", "probe", "runlog", "tickets"]
