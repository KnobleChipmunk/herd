# Example bindings: the machine herd was built on (Claude Code lead, a Codex
# builder on a local model through its `swift15` profile, falling back to pi on
# the same model; Codex reviewers). Copy to ~/.config/herd/bindings.yaml and edit,
# or run `herd setup` (#39). This is an example, not a requirement.
version: 1
# Set to true to allow one short diagnostic request per binding (it may use quota).
probe_consent: false
roles:
  lead:
    harness: claude
    model: claude-opus-5-5
  builder:
    harness: codex
    provider: swift15
    model: swift15-codex
    fallback:
      - {harness: pi, provider: ollama, model: swift15-qwen3.8-128k:latest}
  plan_reviewer:
    harness: codex
    model: gpt-6-astra
    settings: {reasoning_effort: high}
    fallback:
      - {harness: codex, model: gpt-6-sol, settings: {reasoning_effort: high}}
      - {harness: claude, model: fable}
  build_reviewer:
    harness: codex
    model: gpt-6-sol
    settings: {reasoning_effort: high}
    fallback:
      - {harness: claude, model: fable}
